[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "value-investment-agent"
version = "0.1.0"
description = "Traceable local investment research workflow"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "akshare>=1.16,<2",
  "pypdf>=5,<6",
  "pypdfium2>=5.13,<6",
  "openpyxl>=3.1,<4",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
research = ["backtrader==1.9.78.123", "pdfplumber==0.11.9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
