name: Core Research Gates

on:
  push:
    branches: [main, codex/web-d1-investment-workbench]
  pull_request:

permissions:
  contents: read

env:
  TMPDIR: ${{ github.workspace }}/.tmp
  TMP: ${{ github.workspace }}/.tmp
  TEMP: ${{ github.workspace }}/.tmp
  PYTHONDONTWRITEBYTECODE: "1"

