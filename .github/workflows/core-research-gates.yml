name: Core Research Gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Verify fail-closed offline research gates
        run: >-
          python -m pytest -q
          tests/test_research_gate.py
          tests/test_valuation_result.py
          tests/test_price_bridge.py
          tests/test_research_profile.py
          tests/test_distribution.py
          tests/test_valuation_confidence.py
          tests/test_valuation_router.py
          tests/test_price_attractiveness.py
          tests/test_valuation_assumptions.py
          tests/test_materiality.py
          tests/test_gap_classification.py
          tests/test_current_research_status.py
          tests/test_fixed_sample_admission.py
          tests/test_human_research_approval.py
          tests/test_event_materiality.py
          tests/test_valuation_bridge_review.py
          tests/test_interim_report_policy.py
          tests/test_pre_decision_eligibility.py
          tests/test_investment_decision.py
          tests/test_decision_read_model.py
          tests/test_m3_decision_application.py
          tests/test_m3_decision_card_workbook.py
          tests/test_m3_decision_acceptance_audit.py
          tests/test_unified_fcff_valuation.py
          tests/test_residual_income_equity_valuation.py
          tests/test_cyclical_normalized_valuation.py
          tests/test_research_artifacts.py
          tests/test_research_artifact_codecs.py
          tests/test_research_artifact_repository.py
          tests/test_research_runtime_import.py
          tests/test_research_application.py
          tests/test_research_input.py
          tests/test_research_read_model.py
          tests/test_m1_research_dossier_candidate.py
          tests/test_research_dossier_workbook.py
          tests/test_valuation_model_registry.py
          tests/test_fixed_sample_manifest.py
          tests/test_m1_sample_preregistration.py
          tests/test_research_batch.py
          tests/test_research_e2e_replay.py
          tests/test_m1_post_review_receipts_boundary.py
          tests/test_m2_opportunity_discovery.py
          tests/test_m2_coverage_sampling.py
          tests/test_m2_research_report.py
          tests/test_m2_acceptance_audit.py

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: research_agent_test
          POSTGRES_USER: research_agent
          POSTGRES_PASSWORD: research_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research_agent -d research_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      C3_TEST_POSTGRES_DSN: >-
        postgresql://research_agent:research_agent@localhost:5432/research_agent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Verify disposable PostgreSQL research repository
        run: python -m pytest -q tests/test_postgres_research_artifacts.py
