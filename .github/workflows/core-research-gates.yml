      - name: Retain offline-core test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-research-gates-pytest-results
          path: .tmp/*.xml
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: research_agent_test
          POSTGRES_USER: research_agent
          POSTGRES_PASSWORD: research_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research_agent -d research_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      restore-postgres:
        image: postgres:16
        env:
          POSTGRES_DB: value_agent_restore
          POSTGRES_USER: research_agent
          POSTGRES_PASSWORD: research_agent
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U research_agent -d value_agent_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      C3_TEST_POSTGRES_DSN: >-
        postgresql://research_agent:research_agent@localhost:5432/research_agent_test
      M6_TEST_RESTORE_DSN: >-
        postgresql://research_agent:research_agent@127.0.0.1:5433/value_agent_restore
      M6_TEST_ARTIFACT_DIR: .tmp/m6-ci-restore-artifacts
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project-local temporary directory
        run: mkdir -p .tmp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Install PostgreSQL client for isolated restore drill
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify disposable PostgreSQL research repository
        run: python -B -m pytest -q -p no:cacheprovider --basetemp=.tmp/pytest --junitxml=.tmp/postgres-integration-results.xml tests/test_postgres_research_artifacts.py tests/test_m6_restore_integration.py
      - name: Retain synthetic isolated restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-synthetic-restore-evidence
          path: .tmp/m6-ci-restore-artifacts/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
